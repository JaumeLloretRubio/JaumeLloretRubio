name: profile-stats

# Regenera assets/stats-*.svg y assets/langs-*.svg con datos reales de GitHub.
on:
  schedule:
    - cron: "17 4 * * *"      # cada dia a las 04:17 UTC
  workflow_dispatch:           # boton manual en la pestana Actions
  push:
    branches: [main]
    paths:
      - "scripts/gen_stats.py"
      - ".github/workflows/profile-stats.yml"

permissions:
  contents: write

# Dos ejecuciones a la vez pisandose entre si son la causa tipica del push rechazado.
concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render SVG cards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python3 scripts/gen_stats.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats-*.svg assets/langs-*.svg
          if git diff --staged --quiet; then
            echo "sin cambios, nada que commitear"
            exit 0
          fi
          git commit -m "chore: refresh profile stats"
          # Si alguien ha empujado a main mientras corria el job, rebasamos y reintentamos.
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "push rechazado, reintento $i"
            sleep 5
          done
          exit 1
